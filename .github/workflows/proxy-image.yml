name: Build proxy-enabled image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Versioned GHCR tag, for example proxy-v1.2.1-amd64
        required: true
        type: string
  push:
    tags:
      - "proxy-v*"

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and publish GHCR image
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual image tag
        if: github.event_name == 'workflow_dispatch'
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^proxy-v[0-9]+\.[0-9]+\.[0-9]+-amd64$ ]]; then
            echo 'Use a versioned proxy-vX.Y.Z-amd64 tag.' >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # The full Stalwart release build exceeds the GitHub runner memory
          # limit when cross-compiling the ARM64 target. The current kccolhub
          # worker pool is AMD64, so publish that target explicitly.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
